// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Capacitor 7'nin varsayılan derleme hedefi (JDK 21) bu makinede kurulu değil
    // (sadece 11/17 var) — tüm modülleri kurulu JDK 17'ye zorluyoruz. node_modules
    // içindeki üretilmiş/eklenti build.gradle dosyalarını elle düzenlemek yerine
    // (bunlar `npm install`/`cap sync` ile her an ezilebilir) bunu tek, kalıcı bir
    // yerden (kök build.gradle) her modülün kendi ayarından SONRA uyguluyoruz.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
