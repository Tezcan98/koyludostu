<style>
  .inbox-wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .inbox-wrap h1{font-size:20px;font-weight:800;margin:6px 0 18px;}
  .conv-item{
    display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;
  }
  .conv-item .conv-icon{
    width:42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;
  }
  .conv-item .conv-body{flex:1;min-width:0;}
  .conv-item .conv-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .conv-item .conv-last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item .conv-badge{
    font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:var(--ring1);color:#fff;flex-shrink:0;
  }
  .inbox-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13.5px;}
  .inbox-empty a{color:var(--ring1);font-weight:700;}
  .conv-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0;}
  .inbox-top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px;}
  .inbox-top h1{margin:0;}
  .inbox-top a{font-size:12.5px;font-weight:700;color:var(--ring1);text-decoration:none;}
</style>

<script>
(function () {
  if (!window.KDAuth.requireLogin('/mesajlarim.html')) return;

  function timeAgo(iso) {
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff / 60000);
    if (min < 1) return 'az önce';
    if (min < 60) return min + ' dk önce';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' sa önce';
    return Math.floor(h / 24) + ' gün önce';
  }

  window.KDAuth.authedFetch('/api/messages/conversations')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = document.getElementById('convList');
      var convs = data.conversations || [];
      if (!convs.length) {
        list.innerHTML = '<div class="inbox-empty">Henüz bir satıcıyla mesajlaşmadın.<br><a href="/index.html#urunler">Ürünlere göz at →</a></div>';
        return;
      }
      list.innerHTML = convs.map(function (c) {
        var last = c.messages[c.messages.length - 1];
        var titleAttr = c.productTitle.replace(/"/g, '&quot;');
        return '<div class="conv-item" data-slug="' + c.productSlug + '" data-title="' + titleAttr + '">' +
          '<div class="conv-icon">🌾</div>' +
          '<div class="conv-body">' +
            '<div class="conv-title">' + c.productTitle + '</div>' +
            '<div class="conv-last">' + (last.from === 'buyer' ? 'Sen: ' : '') + last.text + '</div>' +
          '</div>' +
          '<div class="conv-actions">' +
            '<span class="conv-badge">' + timeAgo(c.updatedAt) + '</span>' +
            '<button type="button" class="complaint-cta" data-slug="' + c.productSlug + '" data-title="' + titleAttr + '">Şikayet Et</button>' +
          '</div>' +
        '</div>';
      }).join('');

      list.querySelectorAll('.conv-item').forEach(function (item) {
        item.addEventListener('click', function (e) {
          if (e.target.closest('.complaint-cta')) return;
          window.KDMessages.open(item.dataset.slug, item.dataset.title);
        });
      });
    });
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
