  { slug: 'pekmez-kucuk-kavanoz', title: 'Pekmez (Küçük Kavanoz)', cat: 'Pekmez', producer: 'Fatma Demir', price: '85₺', unit: '/ adet', img: '302163', desc: "400 gr'lık hediyelik kavanoz, kahvaltılık boy. Ev yapımı." },
  { slug: 'kuru-incir', title: 'Kuru İncir', cat: 'İncir', producer: 'Mehmet Arslan', price: '260₺', unit: '/ kg', img: '4499221', desc: "Güneşte doğal kurutulmuş, ilaçsız incir. Kükürtsüz, geleneksel kurutma." },
  { slug: 'taze-incir', title: 'Taze İncir', cat: 'İncir', producer: 'Köylü Dostu', price: '140₺', unit: '/ kg', img: '6310577', desc: "Hasat döneminde günlük toplanan taze incir. Stok kısıtlı, mevsimlik." },
  { slug: 'salamura-yesil-zeytin', title: 'Salamura Yeşil Zeytin', cat: 'Zeytin', producer: 'Osman Çelik', price: '160₺', unit: '/ kg', img: '16732695', desc: "Kendi zeytinliğinden, geleneksel salamura yöntemiyle hazırlanmış zeytin." },

  { slug: 'kuru-kayisi', title: 'Kuru Kayısı', cat: 'Kuru Meyve', producer: 'Songül Aydın', price: '240₺', unit: '/ kg', img: '10111994', desc: "Güneşte doğal kurutulmuş, kükürtsüz kuru kayısı. Koyu rengi doğallığının göstergesidir." },
  { slug: 'kabuklu-ceviz', title: 'Kabuklu Ceviz', cat: 'Kuruyemiş', producer: 'Hüseyin Kaya', price: '180₺', unit: '/ kg', img: '1489291', desc: "Bahçeden hasat edilmiş, doğal kurutulmuş kabuklu ceviz. Kırıldığında taze ve dolgun iç verir." },
  { slug: 'badem-ici', title: 'Badem İçi', cat: 'Kuruyemiş', producer: 'Fatma Yıldırım', price: '320₺', unit: '/ kg', img: '5202282', desc: "Kabuğu çıkarılmış, kavrulmamış çiğ badem içi. Katkısız ve doğal." },
  { slug: 'suzme-cicek-bali', title: 'Süzme Çiçek Balı', cat: 'Bal', producer: 'Mustafa Demirel', price: '380₺', unit: '/ kg', img: '315420', desc: "Kendi arılıklarından süzülen, ısıtılmamış çiçek balı. Katkısız ve mevsiminde hasat edilir." },
  { slug: 'ezine-tulum-peyniri', title: 'Ezine Tulum Peyniri', cat: 'Peynir', producer: 'Ayşe Güneş', price: '350₺', unit: '/ kg', img: '6660248', desc: "Koyun ve keçi sütünden, geleneksel yöntemle mağarada olgunlaştırılmış tulum peyniri." },

  { slug: 'nar', title: 'Nar', cat: 'Meyve', producer: 'Elif Korkmaz', price: '60₺', unit: '/ kg', img: '12148142', desc: "Ekim-kasım ayında hasat edilen, taneleri iri ve sulu, ilaçsız nar." },
  { slug: 'amasya-elma', title: 'Amasya Elması', cat: 'Meyve', producer: 'Hüseyin Kaya', price: '50₺', unit: '/ kg', img: '28699587', desc: "Kendine özgü aromasıyla bilinen, doğal yetiştirilmiş Amasya tipi elma." },
  { slug: 'karadut-receli', title: 'Karadut Reçeli', cat: 'Reçel', producer: 'Songül Aydın', price: '150₺', unit: '/ kavanoz', img: '15209691', desc: "Şeker oranı düşük tutularak, geleneksel yöntemle kaynatılmış ev yapımı karadut reçeli." },
  { slug: 'gemlik-zeytini', title: 'Gemlik Zeytini', cat: 'Zeytin', producer: 'Osman Çelik', price: '200₺', unit: '/ kg', img: '4109912', desc: "İri taneli, az çekirdekli Gemlik tipi siyah zeytin. Geleneksel salamura yöntemiyle olgunlaştırılır." }
];

(function () {
  var container = document.getElementById('reelContainer');
  var progressEl = document.getElementById('reelProgress');
  var LIKE_KEY = 'kd_vitrin_begeniler';

  function getLikes() {
    try { return JSON.parse(localStorage.getItem(LIKE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function toggleLike(slug, btn) {
    var likes = getLikes();
    likes[slug] = !likes[slug];
    localStorage.setItem(LIKE_KEY, JSON.stringify(likes));
    btn.classList.toggle('liked', !!likes[slug]);
  }

  var likes = getLikes();

  progressEl.innerHTML = PRODUCTS.map(function () { return '<span><i></i></span>'; }).join('');
  var dots = progressEl.children;

  container.innerHTML = PRODUCTS.map(function (p, i) {
    var imgUrl = 'https://images.pexels.com/photos/' + p.img + '/pexels-photo-' + p.img + '.jpeg?auto=compress&cs=tinysrgb&w=1080';
    return (
      '<section class="reel-slide" id="' + p.slug + '" data-i="' + i + '">' +
        '<img src="' + imgUrl + '" alt="' + p.title + '" loading="' + (i < 2 ? 'eager' : 'lazy') + '">' +
        '<div class="reel-gradient"></div>' +
        '<div class="reel-actions">' +
          '<button class="reel-action-btn like-btn' + (likes[p.slug] ? ' liked' : '') + '" data-slug="' + p.slug + '" aria-label="Beğen">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
          '</button>' +        '</div>' +
        '<div class="reel-content">' +
          '<div class="reel-cat">' + p.cat + ' · ' + p.producer + '</div>' +
          '<h2 class="reel-title">' + p.title + '</h2>' +
          '<p class="reel-desc">' + p.desc + '</p>' +
          '<div class="reel-cta-row">' +
            '<div class="reel-price">' + p.price + ' <small>' + p.unit + '</small></div>' +
            '<a class="reel-go" href="urun/' + p.slug + '.html">Ürüne Git →</a>' +
          '</div>' +
        '</div>' +
      '</section>'
    );
  }).join('');

  container.querySelectorAll('.like-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { toggleLike(btn.dataset.slug, btn); });
  });
  var slides = container.querySelectorAll('.reel-slide');
  var current = 0;

  var wantedSlug = location.hash.replace('#', '');
  if (wantedSlug) {
    var idx = PRODUCTS.findIndex(function (p) { return p.slug === wantedSlug; });
    if (idx > -1) {
      current = idx;
      container.style.scrollBehavior = 'auto';
      var targetTop = slides[idx].getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop;
      container.scrollTop = targetTop;
      requestAnimationFrame(function () {
        container.scrollTop = targetTop;
        requestAnimationFrame(function () { container.style.scrollBehavior = ''; });
      });
      Array.prototype.forEach.call(dots, function (d, di) { d.classList.toggle('done', di <= idx); });
    }
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        var i = Number(entry.target.dataset.i);
        current = i;
        Array.prototype.forEach.call(dots, function (d, di) {
          d.classList.toggle('done', di <= i);
        });
      }
    });
  }, { root: container, threshold: [0.6] });
  slides.forEach(function (s) { observer.observe(s); });

  function goTo(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[i].scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('navUp').addEventListener('click', function () { goTo(current - 1); });
  document.getElementById('navDown').addEventListener('click', function () { goTo(current + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    if (e.key === 'ArrowDown') { e.preventDefault(); goTo(current + 1); }
    if (e.key === 'Escape') { location.href = 'index.html'; }
  });
})();
</script>
