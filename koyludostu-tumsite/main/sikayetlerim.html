<style>
  .inbox-wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .inbox-wrap h1{font-size:20px;font-weight:800;margin:6px 0 18px;}
  .cx-item{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;}
  .cx-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
  .cx-title{font-size:13.5px;font-weight:700;}
  .cx-status{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:10px;flex-shrink:0;}
  .cx-status.open{background:#f4e3c8;color:#8a5a10;}
  .cx-status.resolved{background:#e0ecdc;color:var(--ring1);}
  .cx-reason{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .cx-text{font-size:12.5px;color:var(--ink);line-height:1.5;}
  .cx-response{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:12.5px;}
  .cx-response b{display:block;margin-bottom:3px;font-size:11.5px;color:var(--muted);}
  .inbox-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13.5px;}
  .inbox-empty a{color:var(--ring1);font-weight:700;}
</style>

<script src="assets/auth.js"></script>
<script>
(function () {
  if (!window.KDAuth.requireLogin('/sikayetlerim.html')) return;

  var REASON_LABELS = { kalite: 'Kalite düşük', gelmedi: 'Ürün hiç gelmedi', farkli: 'Tarif edilenden farklı', diger: 'Diğer' };

  function timeAgo(iso) {
    var diff = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diff / 60000);
    if (min < 1) return 'az önce';
    if (min < 60) return min + ' dk önce';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' sa önce';
    return Math.floor(h / 24) + ' gün önce';
  }

  window.KDAuth.authedFetch('/api/complaints/mine')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = document.getElementById('cxList');
      var items = data.complaints || [];
      if (!items.length) {
        list.innerHTML = '<div class="inbox-empty">Henüz bir şikayetin yok.<br><a href="/mesajlarim.html">Mesajlarıma dön →</a></div>';
        return;
      }
      list.innerHTML = items.map(function (c) {
        var statusLabel = c.status === 'resolved' ? 'Çözüldü' : 'Beklemede';
        var response = c.sellerResponse
          ? '<div class="cx-response"><b>Satıcı yanıtı</b>' + c.sellerResponse + '</div>'
          : '';
        return '<div class="cx-item">' +
          '<div class="cx-head"><span class="cx-title">' + c.productTitle + '</span><span class="cx-status ' + c.status + '">' + statusLabel + '</span></div>' +
          '<div class="cx-reason">' + (REASON_LABELS[c.reason] || c.reason) + ' · ' + timeAgo(c.createdAt) + '</div>' +
          '<div class="cx-text">' + c.text.replace(/[<>]/g, '') + '</div>' +
          response +
        '</div>';
      }).join('');
    });
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
